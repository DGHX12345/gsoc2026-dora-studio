# Structural example for the dviz Path Visualization tool (M12 D5):
# lets Studio's tool recommendation engine detect planner ports.
# Node scripts are intentionally omitted.
nodes:
  - id: planner
    path: planner.py
    inputs:
      costmap: costmap_node/costmap
    outputs:
      - waypoints
      - trajectory
      - target_point

  - id: costmap_node
    path: costmap_node.py
    outputs:
      - costmap
